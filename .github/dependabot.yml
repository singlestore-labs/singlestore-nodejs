version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directory: '/website'
    schedule:
      interval: 'weekly'

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # The init/autobuild/analyze steps must stay on the same version, so they
      # have to be bumped in a single pull request.
      codeql-action:
        patterns:
          - "github/codeql-action*"
